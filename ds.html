<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trie Autocomplete</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .input-section {
            padding: 30px;
            position: relative;
        }
        #searchInput {
            width: 100%;
            padding: 20px 60px 20px 20px;
            font-size: 18px;
            border: 3px solid #e1e5e9;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s;
        }
        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102,126,234,0.3);
        }
        #clearBtn {
            position: absolute;
            right: 45px;
            top: 50%;
            transform: translateY(-50%);
            background: #ff6b6b;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: 0.3s;
        }
        #searchInput:valid ~ #clearBtn { opacity: 1; }
        .stats {
            display: flex;
            gap: 30px;
            padding: 0 30px 20px;
            font-weight: 600;
            color: #666;
        }
        .suggestions {
            max-height: 300px;
            overflow-y: auto;
            list-style: none;
        }
        .suggestion-item {
            padding: 15px 30px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: 0.2s;
        }
        .suggestion-item:hover, .suggestion-item.selected {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
        }
        .actions {
            padding: 20px 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        .btn-danger { background: #ff6b6b; }
        .btn-secondary { background: #f8f9fa; color: #666; }
        @media (max-width: 600px) {
            .stats { flex-direction: column; gap: 10px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 Trie Autocomplete</h1>
            <p>Advanced prefix search engine (500+ words)</p>
        </div>
        
        <div class="input-section">
            <input type="text" id="searchInput" placeholder="Type to search... (try 'a', 'b', 'c'...)">
            <button id="clearBtn">✕</button>
        </div>
        
        <div class="stats">
            <span>Words: <span id="totalWords">0</span></span>
            <span>Nodes: <span id="totalNodes">0</span></span>
            <span>Suggestions: <span id="suggestionCount">0</span></span>
        </div>
        
        <ul id="suggestionsList" class="suggestions"></ul>
        
        <div class="actions">
            <button onclick="app.loadFullDictionary()">📚 Load Full Dict (500+)</button>
            <button onclick="app.loadSample()">🧪 Quick Sample</button>
            <button onclick="app.addWord()">➕ Add Word</button>
            <button class="btn-danger" onclick="app.clearAll()">🗑️ Clear All</button>
        </div>
    </div>

    <script>
        // TRIE NODE
        class TrieNode {
            constructor() {
                this.children = {};
                this.isEnd = false;
                this.count = 0;
            }
        }

        // TRIE CLASS
        class Trie {
            constructor() {
                this.root = new TrieNode();
                this.totalWords = 0;
                this.totalNodes = 1;
            }
            
            insert(word) {
                let node = this.root;
                for (let char of word.toLowerCase()) {
                    if (!node.children[char]) {
                        node.children[char] = new TrieNode();
                        this.totalNodes++;
                    }
                    node = node.children[char];
                }
                if (!node.isEnd) {
                    node.isEnd = true;
                    this.totalWords++;
                }
                node.count++;
            }
            
            getSuggestions(prefix) {
                let node = this.root;
                for (let char of prefix.toLowerCase()) {
                    if (!node.children[char]) return [];
                    node = node.children[char];
                }
                return this._collect(node, prefix);
            }
            
            _collect(node, prefix) {
                let words = [];
                if (node.isEnd) words.push({word: prefix, count: node.count});
                for (let char in node.children) {
                    words = words.concat(this._collect(node.children[char], prefix + char));
                }
                return words.sort((a,b) => b.count - a.count).slice(0, 8);
            }
        }

        // APP CLASS
        const app = {
            trie: new Trie(),
            suggestions: [],
            selected: -1,
            
            init() {
                document.getElementById('searchInput').addEventListener('input', (e) => this.search(e.target.value));
                document.getElementById('searchInput').addEventListener('keydown', (e) => this.onKey(e));
                document.getElementById('clearBtn').addEventListener('click', () => {
                    document.getElementById('searchInput').value = '';
                    this.clearSuggestions();
                });
            },
            
            search(prefix) {
                this.clearSuggestions();
                if (!prefix) return;
                
                this.suggestions = this.trie.getSuggestions(prefix);
                this.render();
                document.getElementById('suggestionCount').textContent = this.suggestions.length;
            },
            
            render() {
                const list = document.getElementById('suggestionsList');
                list.innerHTML = this.suggestions.map((s, i) => 
                    `<li class="suggestion-item ${i===this.selected?'selected':''}" 
                       onclick="app.select('${s.word}')" data-word="${s.word}">
                        ${s.word} <span>(${s.count}x)</span>
                    </li>`
                ).join('');
            },
            
            onKey(e) {
                switch(e.key) {
                    case 'ArrowDown': 
                        e.preventDefault();
                        this.selected = Math.min(this.selected + 1, this.suggestions.length - 1);
                        this.updateSelection();
                        break;
                    case 'ArrowUp': 
                        e.preventDefault();
                        this.selected = Math.max(this.selected - 1, -1);
                        this.updateSelection();
                        break;
                    case 'Enter':
                        e.preventDefault();
                        if (this.selected >= 0) this.select(this.suggestions[this.selected].word);
                        break;
                }
            },
            
            updateSelection() {
                document.querySelectorAll('.suggestion-item').forEach((item, i) => {
                    item.classList.toggle('selected', i === this.selected);
                });
            },
            
            select(word) {
                document.getElementById('searchInput').value = word;
                this.clearSuggestions();
            },
            
            clearSuggestions() {
                document.getElementById('suggestionsList').innerHTML = '';
                document.getElementById('suggestionCount').textContent = '0';
                this.suggestions = [];
                this.selected = -1;
            },
            
            updateStats() {
                document.getElementById('totalWords').textContent = this.trie.totalWords;
                document.getElementById('totalNodes').textContent = this.trie.totalNodes;
            },

            // FULL DICTIONARY - 20+ words per alphabet!

                    'adventure', 'animation', 'announcement', 'appointment', 'argument',

                    // D (22 words)

                    'database', 'decision', 'degree', 'delivery', 'department', 'design', 'development', 'diagram', 'dictionary', 'dimension',
                    'direction', 'discovery',

                    'education', 'economy', 'editor', 'election', 'element', 'email', 'emergency', 'employee', 'energy', 'engineer',

                    'geography', 'geometry', 'government', 'graduate', 'grain', 'grammar', 'graphic', 'gravity', 'group', 'guide',

                    // H (22 words)

                    'history', 'holiday', 'homework', 'honeycomb', 'horizon', 'hormone', 'hospitality', 'host', 'hour', 'household',
                    'however', 'human',

                    'pear', 'peach', 'pineapple', 'potato', 'pig', 'panda', 'parrot', 'penguin', 'plane', 'planet',

                    'quince', 'quail', 'quartz', 'queen', 'question', 'quick', 'quiet', 'quit',

                    'radio', 'rain', 'raise', 'range', 'rate', 'rather', 'reach', 'read', 'ready', 'real',
                    'reason', 'receive',

                    'strawberry', 'spinach', 'squash', 'snake', 'spider', 'squirrel', 'shark', 'school', 'science', 'screen',

                    'select', 'sell', 'send', 'sense', 'sentence',

                    // T (25 words)
                    'tomato', 'tangerine', 'turnip', 'turkey', 'tiger', 'turtle', 'tree', 'train', 'truck', 'table',
                    'take', 'talk', 'tall', 'tank', 'tape', 'target', 'task', 'tax', 'teach', 'team',
                    'tell', 'ten', 'tend', 'term', 'test',

                    // U (12 words)
                    'ugli', 'umbrella', 'urchin', 'unique', 'unit', 'universe', 'university', 'unless', 'until', 'upper',
                    'upset', 'urban',

                    // V (15 words)
                    'vanilla', 'vegetable', 'violet', 'vulture', 'violin', 'village', 'video', 'view', 'visit', 'voice',
                    'volume', 'vote', 'vowel', 'voyage', 'value',

                    'watermelon', 'water', 'wolf', 'whale', 'walrus', 'window', 'wind', 'wine', 'winter', 'wire',
                    'wise', 'wish', 'with', 'withdraw', 'without', 'woman', 'wonder', 'wood', 'wool', 'word',

                    // X (5 words)
                    'xray', 'xerox', 'xylophone', 'xenon', 'xmas',

                    'yellow', 'yak', 'yam', 'yard', 'yarn', 'yawn', 'year', 'yellow', 'yes', 'yet',

                    // Z (8 words)
                    'zucchini', 'zebra', 'zero', 'zinc', 'zipper', 'zone', 'zoo', 'zoom'
                ];
                
                fullDictionary.forEach(w => this.trie.insert(w));
                this.updateStats();
                alert(`✅ Loaded ${fullDictionary.length} words! (20+ per alphabet)`);
            },
            
            loadSample() {
                const words = ['javascript','java','python','cpp','html','css','react','angular','vue','node','express','mongodb','mysql','git','github','docker','aws','devops','algorithm','data','structure','computer','science'];
                words.forEach(w => this.trie.insert(w));
                this.updateStats();
                alert('✅ Quick sample loaded!');
            },
            
            addWord() {
                const word = prompt('Enter word:');
                if (word && word.trim()) {
                    this.trie.insert(word.trim());
                    this.updateStats();
                    alert(`✅ Added: "${word.trim()}"`);
                }
            },
            
            clearAll() {
                if (confirm('Clear all words?')) {
                    this.trie = new Trie();
                    this.updateStats();
                    this.clearSuggestions();
                }
            }
        };

        // START
        app.init();
        app.updateStats();
    </script>
</body>
</html>
